name: Experiment 3 - Groq GPT-OSS rapid replication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  groq:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Groq API key
        run: |
          test -n "$GROQ_API_KEY" || (echo "GROQ_API_KEY is not configured" && exit 1)

      - name: Test Groq access
        run: |
          HTTP_CODE=$(curl -sS -o groq_models.json -w "%{http_code}" \
            https://api.groq.com/openai/v1/models \
            -H "Authorization: Bearer $GROQ_API_KEY")

          echo "HTTP status: $HTTP_CODE"

          cat groq_models.json

          if [ "$HTTP_CODE" != "200" ]; then
            exit 1
          fi
