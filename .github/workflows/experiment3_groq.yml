name: Experiment 3 - Groq GPT-OSS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  groq:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check API key
        run: |
          test -n "$GROQ_API_KEY" || exit 1

      - name: Build 99-pair subset
        run: |
          python -u code/build_groq_subset.py

      - name: Run 297 responses
        continue-on-error: true
        run: |
          echo "99 pairs × 3 replicates = 297 responses"
          python -u code/run_groq_experiment3.py

      - name: Show result
        if: always()
        run: |
          echo "=== EXPERIMENT 3 STATUS ==="

          if [ -f outputs/experiment3/groq_gpt_oss_20b.jsonl ]; then
            echo -n "Successful records: "
            wc -l < outputs/experiment3/groq_gpt_oss_20b.jsonl
          else
            echo "Successful records: 0"
          fi

          if [ -f outputs/experiment3/groq_gpt_oss_20b.errors.jsonl ]; then
            echo -n "Errors: "
            wc -l < outputs/experiment3/groq_gpt_oss_20b.errors.jsonl
            echo "First error:"
            head -1 outputs/experiment3/groq_gpt_oss_20b.errors.jsonl
          fi

      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment3-groq-raw
          path: |
            outputs/experiment3/
            current_llm/groq_99_pair_subset.jsonl

      - name: Validate
        run: |
          python code/validate_current_llm.py \
            --inputs outputs/experiment3/groq_gpt_oss_20b.jsonl \
            --subset current_llm/groq_99_pair_subset.jsonl \
            --replicates 3

      - name: Analyze
        if: success()
        run: |
          python code/analyze_current_llm.py \
            --inputs outputs/experiment3/groq_gpt_oss_20b.jsonl \
            --outdir results/experiment3 \
            --strict

      - name: Upload results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: experiment3-groq-results
          path: results/experiment3/
