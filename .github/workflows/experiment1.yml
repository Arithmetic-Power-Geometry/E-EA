name: Experiment 1 - retrospective BBQ

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Run Experiment 1 from official BBQ repository
        run: python scripts/run_experiment1.py
      - name: Upload Experiment 1 results
        uses: actions/upload-artifact@v4
        with:
          name: experiment1-results
          path: |
            runtime/experiment1/results/
            runtime/experiment1/BBQ_SOURCE.json
          if-no-files-found: error
