name: Experiment 2 - contemporary LLMs

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - deepseek
          - mistral
          - qwen

      scope:
        description: "Smoke = 10 pairs; Full = frozen 1,000 pairs"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read
