name: Experiment 2 - contemporary Mistral

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Smoke = 10 pairs; Full = frozen 1,000 pairs"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

jobs:
  mistral:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Mistral API key
        run: |
          test -n "$MISTRAL_API_KEY" || \
          (echo "MISTRAL_API_KEY is not configured" && exit 1)

      - name: Run Mistral inference
        run: |
          LIMIT=""
          if [ "${{ inputs.scope }}" = "smoke" ]; then
            LIMIT="--limit 10"
          fi

          python code/run_all_current_llm.py \
            --only mistral $LIMIT

      - name: Upload raw Mistral evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment2-mistral-evidence
          path: outputs/current_llm/
          if-no-files-found: warn

      - name: Validate Mistral evidence
        if: always()
        run: |
          LIMIT=""
          if [ "${{ inputs.scope }}" = "smoke" ]; then
            LIMIT="--limit 10"
          fi

          python code/validate_current_llm.py \
            --inputs outputs/current_llm/mistral_small_4_v26_03.jsonl \
            $LIMIT
