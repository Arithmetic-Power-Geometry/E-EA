name: Run all experiments and publication outputs

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Experiment 2: smoke = 10 pairs; full = frozen 1,000 pairs"
        required: true
        default: "smoke"
        type: choice
        options: [smoke, full]

permissions:
  contents: read

jobs:
  experiment1:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python scripts/run_experiment1.py
      - uses: actions/upload-artifact@v4
        with:
          name: runall-experiment1
          path: |
            runtime/experiment1/results/
            runtime/experiment1/BBQ_SOURCE.json
          if-no-files-found: error

  deepseek:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: test -n "$DEEPSEEK_API_KEY" || (echo "Missing DEEPSEEK_API_KEY" && exit 1)
      - run: |
          LIMIT=""; if [ "${{ inputs.scope }}" = "smoke" ]; then LIMIT="--limit 10"; fi
          python code/run_all_current_llm.py --only deepseek $LIMIT
          python code/validate_current_llm.py --inputs outputs/current_llm/deepseek_v4_flash.jsonl $LIMIT
      - uses: actions/upload-artifact@v4
        with:
          name: runall-deepseek
          path: outputs/current_llm/deepseek_v4_flash.jsonl
          if-no-files-found: error

  mistral:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: test -n "$MISTRAL_API_KEY" || (echo "Missing MISTRAL_API_KEY" && exit 1)
      - run: |
          LIMIT=""; if [ "${{ inputs.scope }}" = "smoke" ]; then LIMIT="--limit 10"; fi
          python code/run_all_current_llm.py --only mistral $LIMIT
          python code/validate_current_llm.py --inputs outputs/current_llm/mistral_small_4_v26_03.jsonl $LIMIT
      - uses: actions/upload-artifact@v4
        with:
          name: runall-mistral
          path: outputs/current_llm/mistral_small_4_v26_03.jsonl
          if-no-files-found: error

  qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: Check Qwen endpoint
        run: |
          test -n "$QWEN_API_KEY" || (echo "Missing QWEN_API_KEY" && exit 1)
          test -n "$QWEN_BASE_URL" || (echo "Missing QWEN_BASE_URL" && exit 1)
      - run: |
          LIMIT=""; if [ "${{ inputs.scope }}" = "smoke" ]; then LIMIT="--limit 10"; fi
          python code/run_all_current_llm.py --only qwen $LIMIT
          python code/validate_current_llm.py --inputs outputs/current_llm/qwen3_5_4b.jsonl $LIMIT
      - uses: actions/upload-artifact@v4
        with:
          name: runall-qwen
          path: outputs/current_llm/qwen3_5_4b.jsonl
          if-no-files-found: error

  publication_outputs:
    needs: [experiment1, deepseek, mistral, qwen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: runall-*
          path: gathered
      - name: Reconstruct input/result folders
        run: |
          mkdir -p runtime/experiment1/results outputs/current_llm
          find gathered/runall-experiment1 -path '*/results/*' -type f | while read f; do rel="${f#*results/}"; mkdir -p "runtime/experiment1/results/$(dirname "$rel")"; cp "$f" "runtime/experiment1/results/$rel"; done
          find gathered -name '*.jsonl' -type f -exec cp {} outputs/current_llm/ \;
      - name: Validate, analyze, and build all manuscript outputs
        run: |
          LIMIT=""; if [ "${{ inputs.scope }}" = "smoke" ]; then LIMIT="--limit 10"; fi
          python code/validate_current_llm.py --inputs outputs/current_llm/*.jsonl $LIMIT
          python code/analyze_current_llm.py --inputs outputs/current_llm/*.jsonl --outdir results/experiment2 --strict
          python code/build_combined_outputs.py --experiment1-root runtime/experiment1 --experiment2-root results/experiment2 --outdir results/combined
          python code/build_output_index.py
      - uses: actions/upload-artifact@v4
        with:
          name: eea-all-manuscript-ready-outputs
          path: |
            runtime/experiment1/results/
            results/experiment2/
            results/combined/
            results/OUTPUT_INDEX.md
          if-no-files-found: error
